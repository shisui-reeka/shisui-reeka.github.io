<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HP更新ページ | 偲睡れーか</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--blue:#8ca9ec;--violet:#8f77c2;--pink:#ff63bd;--paper:#eef1fa;--ink:#2b2f45;--sub:#6b7190;--line:rgba(140,169,236,.38);--line2:rgba(140,169,236,.18);--card:#f8f9fe}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px;font-family:"Hiragino Sans","Yu Gothic",YuGothic,Meiryo,sans-serif;line-height:1.7;letter-spacing:.03em;min-height:100vh;-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.wrap{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.12em}
.lead{color:var(--sub);font-size:13px;margin:0 0 16px}
.sheet{background:var(--card);border:1px solid var(--blue);box-shadow:3px 3px 0 var(--line);padding:16px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.menu{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;text-align:left;border:1px solid var(--blue);background:#fff;font:inherit;color:var(--ink);padding:16px 14px 14px;border-radius:6px;cursor:pointer;min-height:112px;display:flex;flex-direction:column;gap:2px}
.tile:active{transform:scale(.97);border-color:var(--pink)}
.tile .tic{color:var(--violet);margin-bottom:6px}
.tile b{font-size:17px;font-weight:500;letter-spacing:.1em}
.tile small{font-size:11.5px;color:var(--sub);line-height:1.4}
.back{border:0;background:none;color:var(--violet);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
h2{font-size:17px;margin:4px 0 14px;padding-bottom:6px;border-bottom:1px dashed var(--violet)}
label{display:block;font-size:12px;color:var(--violet);margin:12px 0 4px;letter-spacing:.1em}
input[type=text],input[type=url],input[type=password],select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--blue);border-radius:4px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.item{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:6px;padding:4px 12px 12px;margin:12px 0;position:relative}
.item .bar{display:flex;gap:6px;justify-content:flex-end;margin:8px 0 0}
.mini{border:1px solid var(--blue);background:#fff;color:var(--violet);font:inherit;font-size:13px;padding:5px 12px;border-radius:4px;cursor:pointer}
.mini.del{color:#c2185b;border-color:#e6a1bf}
.btn{display:inline-block;border:1px solid var(--violet);background:var(--violet);color:#fff;font:inherit;font-size:15px;padding:11px 24px;border-radius:4px;cursor:pointer}
.btn.line{background:transparent;color:var(--violet)}
.btn:disabled{opacity:.5}
.add{width:100%;margin-top:6px;border:1.5px dashed var(--violet);background:rgba(255,255,255,.6);color:var(--violet);padding:12px;font:inherit;border-radius:6px;cursor:pointer}
.thumb{width:120px;height:120px;border:1px solid var(--blue);background:#fff;object-fit:contain;display:block;margin:4px 0 6px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(238,241,250,.96);border-top:1px solid var(--blue);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;gap:10px;align-items:center;justify-content:center;z-index:20}
.savebar.on{display:flex}
.savebar span{font-size:12px;color:var(--sub)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-80px);background:#fff;border:1.5px solid var(--violet);border-radius:8px;padding:10px 18px;font-size:14px;z-index:50;transition:.3s;max-width:92%;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{border-color:#c2185b;color:#c2185b}
.note{font-size:12px;color:var(--sub);margin:6px 0}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="mono" style="font-size:11px;color:var(--violet)">SHISUI RE-KA / UPDATE</div>
  <h1>HP更新ページ</h1>
  <p class="lead" id="lead">ここから内容を更新できます</p>

  <div id="login" class="sheet hide">
    <h2>はじめに(1回だけ)</h2>
    <p class="note">更新用の鍵(トークン)を貼ってください。この端末に保存されるので、次からは入力しなくて大丈夫です。</p>
    <label>更新用の鍵</label>
    <input type="password" id="tok" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_...">
    <p style="margin-top:14px"><button class="btn" id="tokGo">はじめる</button></p>
  </div>

  <div id="home" class="hide">
    <div class="menu" id="menu"></div>
    <p class="note" style="margin-top:18px">保存すると、1〜2分でサイトに反映されます。<br><a href="./" style="color:var(--violet)">サイトを見る ›</a> ／ <a href="#" id="logout" style="color:var(--sub)">この端末の鍵を消す</a></p>
  </div>

  <div id="view" class="hide">
    <button class="back" id="back">‹ メニューにもどる</button>
    <div class="sheet" id="vbody"></div>
  </div>
</div>
<div class="savebar" id="savebar"><span id="savemsg">変更があります</span><button class="btn" id="save">保存して公開する</button></div>
<div id="toast"></div>

<script src="icons.js?v=5"></script>
<script src="core.js?v=5"></script>
<script src="data.js?v=5"></script>
<script>
window.ICONS.drip='<path d="M7 4h10v7a5 5 0 0 1-10 0z"/><path d="M7 8h10"/><path d="M10 1h4"/><path d="M12 1v3"/><path d="M12 16v2"/><path d="M12 19.5c-1 1.2-1.6 2-1.6 2.6a1.6 1.6 0 0 0 3.2 0c0-.6-.6-1.4-1.6-2.6z"/>';
(function(){
const OWNER='shisui-reeka', REPO='shisui-reeka.github.io', BR='main';
const API='https://api.github.com/repos/'+OWNER+'/'+REPO;
const $=s=>document.querySelector(s);
const S=window.SITE;
let token='', C={}, dirty=false, current=null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function toast(t,err){const e=$('#toast');e.textContent=t;e.className='on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',err?5000:3200)}
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in (attrs||{})){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else if(k==='html')e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k])}kids.flat().forEach(c=>c!=null&&e.append(c.nodeType?c:document.createTextNode(c)));return e}
function mark(){dirty=true;$('#savebar').classList.add('on');$('#savemsg').textContent='変更があります'}

/* ---- field helpers ---- */
function fText(label,obj,key,opts){opts=opts||{};const i=el('input',{type:opts.type||'text',value:obj[key]==null?'':obj[key],placeholder:opts.ph||''});i.addEventListener('input',()=>{obj[key]=i.value;mark()});return [el('label',{},label),i]}
function fArea(label,obj,key,toStr,fromStr){const t=el('textarea');t.value=toStr?toStr(obj[key]):(obj[key]||'');t.addEventListener('input',()=>{obj[key]=fromStr?fromStr(t.value):t.value;mark()});return [el('label',{},label),t]}
function fSelect(label,obj,key,opts){const s=el('select');opts.forEach(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;const op=el('option',{value:v},l);if(obj[key]===v)op.selected=true;s.append(op)});s.addEventListener('change',()=>{obj[key]=s.value;mark()});return [el('label',{},label),s]}

/* ---- image upload ---- */
function resizeToBlob(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>{if(b&&b.type==='image/webp')res({blob:b,ext:'webp'});else c.toBlob(b2=>b2?res({blob:b2,ext:'png'}):rej(new Error('変換できませんでした')),'image/png')},'image/webp',.86)};im.onerror=()=>rej(new Error('画像を読み込めませんでした'));im.src=url})}
function blobB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)})}
async function ghGet(path){const r=await fetch(API+'/contents/'+path+'?ref='+BR+'&t='+Date.now(),{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'},cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('読み込みに失敗しました ('+r.status+')');return r.json()}
async function ghPut(path,b64,msg){let sha;try{const cur=await ghGet(path);sha=cur&&cur.sha}catch(e){}
  const body={message:msg,content:b64,branch:BR};if(sha)body.sha=sha;
  const r=await fetch(API+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error('保存に失敗しました ('+r.status+') '+m)}return r.json()}
function fImage(label,obj,key){
  const wrap=el('div');const th=el('img',{class:'thumb',alt:''});const setTh=()=>{th.style.display=obj[key]?'':'none';if(obj[key])th.src=obj[key]};setTh();
  const f=el('input',{type:'file',accept:'image/*',class:'hide'});
  const b=el('button',{class:'mini',type:'button',onclick:()=>f.click()},obj[key]?'画像をえらびなおす':'画像をえらぶ');
  f.addEventListener('change',async()=>{const file=f.files&&f.files[0];if(!file)return;b.disabled=true;b.textContent='アップロード中…';
    try{const {blob,ext}=await resizeToBlob(file,1400);const b64=await blobB64(blob);const path='img/u/'+Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.'+ext;await ghPut(path,b64,'upload image');obj[key]=path;th.style.display='';th.src=URL.createObjectURL(blob);b.textContent='画像をえらびなおす';mark();toast('画像をアップロードしました')}
    catch(e){toast(e.message||'失敗しました',true);b.textContent='画像をえらぶ'}b.disabled=false;f.value=''});
  wrap.append(el('label',{},label),th,b,f);return wrap}

/* ---- generic list editor ---- */
function listEditor(arr,fields,make,addLabel,render){
  const box=el('div');
  const redraw=()=>{box.innerHTML='';arr.forEach((it,i)=>{
    const card=el('div',{class:'item'});
    fields(it,card,i);
    card.append(el('div',{class:'bar'},
      el('button',{class:'mini',type:'button',onclick:()=>{if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];mark();redraw()}}},'↑'),
      el('button',{class:'mini',type:'button',onclick:()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];mark();redraw()}}},'↓'),
      el('button',{class:'mini del',type:'button',onclick:()=>{if(confirm('これを消しますか?')){arr.splice(i,1);mark();redraw()}}},'消す')));
    box.append(card)});
    box.append(el('button',{class:'add',type:'button',onclick:()=>{arr.push(make());mark();redraw();const cs=box.querySelectorAll('.item');cs.length&&cs[cs.length-1].scrollIntoView({block:'center'})}},addLabel||'＋ ついか'))};
  redraw();return box}
const app=(parent,x)=>[].concat(x).forEach(n=>n&&parent.append(n));

/* ---- views ---- */
const GROUPS=[['SNS','SNS'],['SHOP','支援・ショップ'],['WORK','お仕事'],['OTHER','その他']];
const VIEWS={
 profile:{t:'プロフィール',s:'ひとこと・プロフィール表',i:'pill',r(b){
   b.append(el('h2',{},'プロフィール'));
   app(b,fText('ひとこと(名前の下の文)',C,'sub'));
   app(b,fArea('ごあいさつ(1行=1段落)',C,'about',v=>(v||[]).join('\n'),s=>s.split('\n').filter(x=>x.trim())));
   b.append(el('label',{},'プロフィール表'));
   b.append(listEditor(C.chart,(it,card)=>{
     const o={k:it[0],v:it[1]};
     const a=fText('項目名',o,'k');const c=fText('内容',o,'v');
     [a[1],c[1]].forEach(inp=>inp.addEventListener('input',()=>{it[0]=o.k;it[1]=o.v}));
     app(card,a);app(card,c)},()=>['',''],'＋ 項目をふやす'));}},
 credits:{t:'クレジット',s:'イラスト・配信画面などの担当者',i:'heart-handshake',r(b){
   b.append(el('h2',{},'クレジット'));b.append(el('p',{class:'note'},'担当の方が変わったら、ここで書き換えられます。内容は「お名前 様 (@Xのid)」の形で書くと、Xへのリンクになります。複数いる場合は「 / 」で区切ってください(例: ねむた 様 (@nenemutaaaa_) / 雷雨れろ 様 (@Raiu_Relo))。'));
   b.append(listEditor(C.credits,(it,card)=>{
     const o={k:it[0],v:it[1]};
     const a=fText('担当(例: 配信画面)',o,'k');const c=fText('お名前とXのid',o,'v');
     [a[1],c[1]].forEach(inp=>inp.addEventListener('input',()=>{it[0]=o.k;it[1]=o.v}));
     app(card,a);app(card,c)},()=>['',''],'＋ 担当をふやす'));
   app(b,fText('下に出る注記',C,'creditsNote'));}},
 links:{t:'リンク',s:'SNS・支援・ほしい物',i:'link',r(b){
   b.append(el('h2',{},'リンク'));b.append(el('p',{class:'note'},'URLが空のものは「準備中」と表示されます。'));
   b.append(listEditor(C.links,(it,card)=>{app(card,fSelect('分類',it,'group',GROUPS));app(card,fText('名前',it,'label'));app(card,fText('ひとこと',it,'sub'));app(card,fText('URL',it,'url',{type:'url',ph:'https://'}))},()=>({group:'SNS',label:'',sub:'',url:''}),'＋ リンクをふやす'));}},
 xposts:{t:'Xポスト',s:'ポストのURLを貼る',i:'brand-x',r(b){
   b.append(el('h2',{},'Xポスト'));b.append(el('p',{class:'note'},'載せたいポストのURL(…/status/数字)を貼ってください。上のものほど先に表示されます。'));
   const rows=C.xposts.map(u=>({u}));
   const sync=()=>{C.xposts=rows.map(r=>r.u).filter(Boolean)};
   b.append(listEditor(rows,(it,card)=>{const f=fText('ポストのURL',it,'u',{type:'url',ph:'https://x.com/…/status/…'});f[1].addEventListener('input',sync);app(card,f)},()=>({u:''}),'＋ ポストをふやす'));
   b.addEventListener('click',sync);b.addEventListener('input',sync);}},
 archive:{t:'アーカイブ',s:'配信・ハイライト',i:'player-play',r(b){
   b.append(el('h2',{},'配信アーカイブ・ハイライト'));
   b.append(listEditor(C.archive,(it,card)=>{app(card,fText('タイトル',it,'title'));app(card,fSelect('種類',it,'kind',['配信','ハイライト','歌ってみた','その他']));app(card,fText('日付(例: 2026-10-25)',it,'date'));app(card,fText('動画のURL',it,'url',{type:'url',ph:'https://www.youtube.com/watch?v=…'}))},()=>({title:'',kind:'配信',date:'',url:''}),'＋ 動画をふやす'));}},
 gallery:{t:'ギャラリー',s:'イラスト・作品',i:'photo',r(b){
   b.append(el('h2',{},'イラストギャラリー'));
   const cats=S.galleryCats.filter(c=>c!=='すべて');
   b.append(listEditor(C.gallery,(it,card)=>{card.append(fImage('画像',it,'img'));app(card,fText('作品名',it,'title'));app(card,fSelect('分類',it,'cat',cats));app(card,fText('描いた人・メモ',it,'by'))},()=>({title:'',cat:cats[0],by:'',img:''}),'＋ 作品をふやす'));}},
 request:{t:'依頼',s:'受付状況・料金',i:'pencil',r(b){
   const c=C.commission;
   b.append(el('h2',{},'依頼の受付状況'));
   app(b,fSelect('いまの状況',c,'status',[['open','受付中'],['ask','要相談'],['closed','停止中']]));
   app(b,fArea('ひとこと',c,'note'));
   b.append(el('h2',{style:'margin-top:22px'},'料金表'));
   app(b,fText('料金表・規約のページURL',c,'pricesUrl',{type:'url',ph:'https://lit.link/…'}));
   app(b,fText('料金表の説明文',c,'pricesNote'));
   b.append(el('label',{},'料金(ここに書くとサイトにも表の形で出ます)'));
   b.append(listEditor(c.prices,(it,card)=>{app(card,fText('内容(例: アイコン)',it,'item'));app(card,fText('金額(例: 3,000円〜)',it,'price'));app(card,fText('メモ',it,'note'))},()=>({item:'',price:'',note:''}),'＋ 料金をふやす'));}},
 talk:{t:'セリフ',s:'立ち絵をタップした時のひとこと',i:'pill',r(b){
   b.append(el('h2',{},'立ち絵のセリフ'));b.append(el('p',{class:'note'},'立ち絵やミニキャラをタップするとランダムに出ます。1行=1セリフ。吹き出しで改行してよい場所に「/」を入れると、きれいに折り返します(例: 本日の処方、/始めますか?)。'));
   app(b,fArea('セリフ(1行=1つ)',C,'talk',v=>(v||[]).join('\n'),s=>s.split('\n').filter(x=>x.trim())));
   app(b,fText('タップしすぎた時のセリフ',C,'talkOver'));}},
 fortunes:{t:'おみくじ',s:'今日の処方箋の文言',i:'pill',r(b){
   b.append(el('h2',{},'今日の処方箋(おみくじ)'));b.append(el('p',{class:'note'},'上から良い順に並べてください(問診票の答えで出やすさが変わります)。'));
   b.append(listEditor(C.fortunes,(it,card)=>{app(card,fText('ランク名(例: 特効薬)',it,'rank'));app(card,fText('運勢(例: 大吉)',it,'sub'));app(card,fArea('ひとこと',it,'msg'));app(card,fText('効き目(1〜5)',it,'stars'));app(card,fArea('用法',it,'use'));app(card,fArea('副作用',it,'side'));app(card,fText('ラッキーアイテム',it,'lucky'));app(card,fText('服用時間',it,'time'))},()=>({rank:'',sub:'',stars:3,msg:'',use:'',side:'',lucky:'',time:''}),'＋ ふやす'));}},
 goods:{t:'ショップ',s:'グッズ・販売ページ',i:'shopping-bag',r(b){
   b.append(el('h2',{},'ショップ・グッズ'));
   b.append(listEditor(C.goods,(it,card)=>{card.append(fImage('画像',it,'img'));app(card,fText('名前',it,'title'));app(card,fText('ひとこと',it,'note'));app(card,fText('販売ページのURL',it,'url',{type:'url',ph:'https://'}))},()=>({title:'',note:'',url:'',img:''}),'＋ 商品をふやす'));}}
};

function openView(id){current=id;$('#home').classList.add('hide');$('#view').classList.remove('hide');const b=$('#vbody');b.innerHTML='';VIEWS[id].r(b);window.scrollTo(0,0)}
function goHome(){if(dirty&&!confirm('保存していない変更があります。メニューにもどりますか?(変更は消えません。保存は下のボタンから)'))return;$('#view').classList.add('hide');$('#home').classList.remove('hide');window.scrollTo(0,0)}
function buildMenu(){const m=$('#menu');m.innerHTML='';Object.keys(VIEWS).forEach(id=>{const v=VIEWS[id];m.append(el('button',{class:'tile',type:'button',onclick:()=>openView(id)},el('span',{class:'tic',html:ico(v.i,28)}),el('b',{},v.t),el('small',{},v.s)))})}
$('#back').addEventListener('click',goHome);

/* ---- save ---- */
$('#save').addEventListener('click',async()=>{const b=$('#save');b.disabled=true;b.textContent='保存中…';
  try{
    const out={};window.EDITABLE.forEach(k=>out[k]=C[k]);
    out.commission.prices=(out.commission.prices||[]).filter(p=>p.item||p.price);
    const s=JSON.stringify(out,null,1);const b64=btoa(unescape(encodeURIComponent(s)));
    await ghPut('content.json',b64,'update content');
    dirty=false;$('#savebar').classList.remove('on');toast('保存しました。1〜2分で、サイトに反映されます。');
  }catch(e){toast(e.message||'保存に失敗しました',true)}
  b.disabled=false;b.textContent='保存して公開する'});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---- boot ---- */
async function start(){
  await window.loadContent();
  C={};window.EDITABLE.forEach(k=>C[k]=JSON.parse(JSON.stringify(S[k]===undefined?(k==='sub'?'':[]):S[k])));
  C.commission=C.commission||{};C.commission.prices=C.commission.prices||[];
  buildMenu();$('#login').classList.add('hide');$('#home').classList.remove('hide')}
async function tryToken(t){token=t;const r=await fetch(API,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});
  if(!r.ok)throw new Error('鍵が正しくないようです ('+r.status+')');const j=await r.json();if(!(j.permissions&&j.permissions.push))throw new Error('この鍵には、書きこみの権限がありません');return true}
$('#tokGo').addEventListener('click',async()=>{const t=$('#tok').value.trim();if(!t)return;const b=$('#tokGo');b.disabled=true;
  try{await tryToken(t);store.set('rk_tok',t);await start()}catch(e){toast(e.message||'失敗しました',true)}b.disabled=false});
$('#logout').addEventListener('click',e=>{e.preventDefault();if(confirm('この端末の鍵を消します。よろしいですか?')){store.del('rk_tok');location.reload()}});
(async()=>{const t=store.get('rk_tok');if(t){try{await tryToken(t);await start();return}catch(e){toast('もう一度、鍵を入れてください',true)}}$('#login').classList.remove('hide')})();
})();
</script>
</body>
