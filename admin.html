function buildMenu(){const m=$('#menu');m.innerHTML='';Object.keys(VIEWS).forEach(id=>{const v=VIEWS[id];m.append(el('button',{class:'tile',type:'button',onclick:()=>openView(id)},el('span',{class:'tno mono'},'No.'+String(Object.keys(VIEWS).indexOf(id)+1).padStart(2,'0')),el('span',{class:'tic',html:ico(v.i,28)}),el('b',{},v.t),el('small',{},v.s)))})}

/* ---- save ---- */
$('#save').addEventListener('click',async()=>{const b=$('#save');b.disabled=true;b.textContent='保存中…';
  try{
    const out={};window.EDITABLE.forEach(k=>out[k]=C[k]);
    try{const sc=out.schedule||{};const cmp=JSON.stringify({n:sc.note||'',d:sc.days||[]});if(cmp!==window.__schOrig){sc.updated=new Date().toISOString();window.__schOrig=cmp}}catch(e){}
    out.commission.prices=(out.commission.prices||[]).filter(p=>p.item||p.price);
    const s=JSON.stringify(out,null,1);const b64=btoa(unescape(encodeURIComponent(s)));
    await ghPut('content.json',b64,'update content');
    dirty=false;$('#savebar').classList.remove('on');toast('保存しました。1〜2分で、サイトに反映されます。');
  }catch(e){toast(e.message||'保存に失敗しました',true)}
  b.disabled=false;b.textContent='保存して公開する'});

/* ---- boot ---- */
function keepHash(){try{if(encBlob)history.replaceState(null,'',location.pathname+location.search+'#e='+encBlob)}catch(e){}}
async function start(){keepHash();
  await window.loadContent();
  C={};window.EDITABLE.forEach(k=>C[k]=JSON.parse(JSON.stringify(S[k]===undefined?(k==='sub'?'':[]):S[k])));
  try{const sc=C.schedule||{};window.__schOrig=JSON.stringify({n:sc.note||'',d:sc.days||[]})}catch(e){}
  C.commission=C.commission||{};C.commission.prices=C.commission.prices||[];
  buildMenu();$('#login').classList.add('hide');$('#home').classList.remove('hide')}
async function tryToken(t){token=t;const r=await fetch(API,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});
  if(!r.ok)throw new Error('ログインできませんでした ('+r.status+')。リンクが古い可能性があります');const j=await r.json();if(!(j.permissions&&j.permissions.push))throw new Error('書きこみの権限がありません');return true}
/* ---- 合言葉(AES-GCM + PBKDF2) ---- */
const b64u={enc:u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),dec:t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((t.length+3)%4)),c=>c.charCodeAt(0))};
async function decryptBlob(blob,pass){const raw=b64u.dec(blob);const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);return new TextDecoder().decode(pt)}
window.__decryptBlob=decryptBlob;
let encBlob='';
$('#tokGo').addEventListener('click',async()=>{const pw=$('#tok').value.trim();if(!pw)return;const b=$('#tokGo');b.disabled=true;b.textContent='確認中…';
  try{if(!encBlob){const mm=($('#lnk').value||'').match(/[#&]e=([A-Za-z0-9_-]+)/);if(mm)encBlob=mm[1]}if(!encBlob)throw new Error('更新用リンクを貼ってください');let t;try{t=await decryptBlob(encBlob,pw)}catch(e){throw new Error('合言葉がちがうようです')}
    await tryToken(t);store.set('rk_tok',t);store.set('rk_enc',encBlob);await start()}catch(e){toast(e.message||'失敗しました',true)}b.disabled=false;b.textContent='はじめる'});
$('#logout').addEventListener('click',e=>{e.preventDefault();if(confirm('この端末のログインを解除します。よろしいですか?')){store.del('rk_tok');location.reload()}});
(async()=>{const m=(location.hash||'').match(/[#&]e=([A-Za-z0-9_-]+)/);
  if(m){encBlob=m[1]}else{encBlob=window.ENC_BLOB||store.get('rk_enc')||''}
  if(m&&store.get('rk_enc')!==encBlob){store.del('rk_tok')}
  const t=store.get('rk_tok');
  if(t){try{await tryToken(t);await start();return}catch(e){toast('もう一度、合言葉を入れてください',true)}}
  if(!encBlob)$('#lnkBox').classList.remove('hide');
  if(!encBlob)$('#loginNote').textContent='合言葉を入力してください。この端末では1回だけで、次からは入力しなくて大丈夫です。';
  $('#login').classList.remove('hide')})();
})();
