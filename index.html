<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>偲睡れーか | 研究ノート</title>
<meta name="description" content="本日の処方を開始します。偲睡れーかの公式サイト">
<meta name="theme-color" content="#eef1fa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --blue:#8ca9ec; --violet:#8f77c2; --pink:#ff63bd;
  --paper:#eef1fa; --ink:#2b2f45; --sub:#6b7190; --line:rgba(140,169,236,.38); --line2:rgba(140,169,236,.18);
  --card:#f8f9fe;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto;overflow-anchor:none}
body{margin:0;color:var(--ink);background-color:var(--paper);
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px),
    linear-gradient(var(--line2) 1px,transparent 1px),
    linear-gradient(90deg,var(--line2) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;
  font-family:"Hiragino Sans","Yu Gothic",YuGothic,Meiryo,sans-serif;line-height:1.85;letter-spacing:.03em;
  min-height:100vh;-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.08em}
a{color:var(--violet)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(36px + env(safe-area-inset-bottom))}

/* header */
header{padding:calc(26px + env(safe-area-inset-top)) 0 10px;text-align:center;position:relative}
.stamp-top{font-size:11px;color:var(--violet);border:1px solid var(--violet);display:inline-block;padding:1px 10px;border-radius:2px;transform:rotate(-2deg)}
h1{margin:10px 0 0;font-size:30px;font-weight:600;letter-spacing:.18em;color:var(--ink)}
.read{font-size:12px;color:var(--sub);margin-top:8px;position:relative}
.tag{margin:8px 0 0;font-size:14px;color:var(--violet)}
.tag::before,.tag::after{content:"✝";color:var(--pink);margin:0 .6em;font-size:11px}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:rgba(238,241,250,.92);backdrop-filter:blur(6px);margin:8px -16px 0;padding:6px 10px 0;border-bottom:1px solid var(--blue);
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs{touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-padding:0 24px}
.tab{touch-action:pan-x;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.tab{flex:0 0 auto;border:1px solid var(--line);border-bottom:none;background:transparent;color:var(--sub);font:inherit;font-size:13px;padding:7px 13px 6px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.tab small{display:block;font-size:9px;line-height:1.1;letter-spacing:.12em;color:var(--blue)}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);border-color:var(--blue);position:relative;top:1px}
.tab[aria-selected=true] small{color:var(--pink)}

/* sections */
.panel{display:none;animation:in .35s ease}
.panel.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sheet{background:var(--card);border:1px solid var(--blue);border-top:none;padding:20px 16px 26px;box-shadow:3px 3px 0 var(--line)}
h2{font-size:17px;font-weight:600;margin:26px 0 12px;padding-bottom:4px;border-bottom:1px dashed var(--violet);display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:0}
h2 .no{font-size:11px;color:#fff;background:var(--violet);padding:0 7px;border-radius:2px;letter-spacing:.1em}
p{margin:0 0 10px}
.muted{color:var(--sub);font-size:13px}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.hero svg{flex:0 0 96px}
.hero p{margin:0}

/* chart table */
table.chart{width:100%;border-collapse:collapse;font-size:14px}
table.chart th,table.chart td{border:1px solid var(--blue);padding:7px 10px;vertical-align:top;text-align:left}
table.chart th{width:32%;background:rgba(140,169,236,.16);font-weight:500;color:var(--violet);font-size:12px}

/* accordion */
details{border:1px solid var(--line);background:rgba(255,255,255,.55);margin:8px 0;border-radius:4px}
summary{cursor:pointer;padding:10px 12px;font-size:14px;list-style:none;display:flex;gap:8px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋";color:var(--pink);font-size:12px;width:14px}
details[open] summary::before{content:"－"}
details .in{padding:2px 14px 12px;font-size:13.5px}
ol.rules{margin:0;padding-left:1.6em;font-size:13.5px}
ol.rules li{margin:0 0 8px}

/* links */
.group{font-size:11px;color:var(--violet);margin:18px 0 6px}
.lk{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:6px 0;border:1px solid var(--blue);background:#fff;color:var(--ink);text-decoration:none;border-radius:4px;transition:.15s}
.lk:hover,.lk:active{border-color:var(--pink);transform:translateX(3px)}
.lk .ic{flex:0 0 22px;color:var(--violet)}
.lk b{display:block;font-weight:500;font-size:14.5px;line-height:1.4}
.lk span.s{font-size:11.5px;color:var(--sub);line-height:1.3}
.lk .go{margin-left:auto;color:var(--blue)}
.lk.off{opacity:.55;pointer-events:none;border-style:dashed}
.badge{font-size:10px;border:1px solid var(--sub);color:var(--sub);padding:0 6px;border-radius:2px;margin-left:auto}

/* cards / gallery */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--blue);background:transparent;color:var(--sub);font:inherit;font-size:12px;padding:3px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.frame{border:1px solid var(--blue);background:#fff;padding:6px;position:relative}
.frame::before{content:"";position:absolute;top:-6px;left:50%;width:46px;height:12px;margin-left:-23px;background:rgba(143,119,194,.28);transform:rotate(-2deg)}
.ph{aspect-ratio:1/1;background:repeating-linear-gradient(45deg,rgba(140,169,236,.14) 0 8px,rgba(140,169,236,.06) 8px 16px);display:flex;align-items:center;justify-content:center;color:var(--blue);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.frame .cap{font-size:12px;padding:6px 2px 0;line-height:1.4}
.frame .cap i{display:block;font-style:normal;color:var(--sub);font-size:10.5px}
.empty{border:1px dashed var(--violet);padding:22px 14px;text-align:center;color:var(--sub);font-size:13px;background:rgba(255,255,255,.5)}

/* status */
.status{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--violet);padding:6px 18px;font-size:16px;letter-spacing:.2em;transform:rotate(-1.5deg);background:#fff}
.status i{width:10px;height:10px;border-radius:50%;display:inline-block}
.status.open{color:var(--violet)} .status.open i{background:var(--pink);box-shadow:0 0 0 4px rgba(255,99,189,.25)}
.status.closed{color:var(--sub);border-color:var(--sub)} .status.closed i{background:var(--sub)}
.status.ask{color:var(--blue);border-color:var(--blue)} .status.ask i{background:var(--blue)}
table.price{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.price td,table.price th{border-bottom:1px dashed var(--violet);padding:8px 4px;text-align:left}
table.price td:last-child{text-align:right;white-space:nowrap}
pre.tpl{white-space:pre-wrap;background:#fff;border:1px solid var(--line);padding:12px;font:inherit;font-size:12.5px;line-height:1.8;margin:8px 0}
.btn{display:inline-block;border:1px solid var(--violet);background:var(--violet);color:#fff;font:inherit;font-size:13px;padding:7px 18px;border-radius:3px;cursor:pointer;text-decoration:none}
.btn.line{background:transparent;color:var(--violet)}
.btn:active{transform:scale(.97)}

/* fortune & stamps */
.rx{background:#fff;border:1px solid var(--blue);padding:18px 16px;text-align:center;position:relative;margin:10px 0}
.rx::before{content:"Rx";position:absolute;top:8px;left:12px;font:italic 22px Georgia,serif;color:var(--blue)}
.rx .rank{font-size:34px;letter-spacing:.2em;color:var(--violet);margin:4px 0}
.rx .sub{font-size:12px;color:var(--pink);letter-spacing:.2em}
.rx .msg{font-size:14px;margin-top:8px}
.card{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.slot{aspect-ratio:1/1;border:1.5px dashed var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:11px;background:#fff}
.slot.on{border:2px solid var(--pink);color:var(--pink);border-style:solid}

/* opening */
#op{position:fixed;inset:0;z-index:100;background-color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .7s,visibility .7s;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
#op.gone{opacity:0;visibility:hidden}
#op{--wz:cubic-bezier(.2,.7,.2,1)}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#op .stars{position:absolute;inset:0;pointer-events:none}
#op .t1{font-size:11px;color:var(--violet);letter-spacing:.4em;margin-top:6px;animation:wipe .8s 1.4s var(--wz) both;position:relative}
#op .t2{font-size:32px;letter-spacing:.2em;animation:wipe .9s .6s var(--wz) both;display:none}
#op .t3{font-size:13px;color:var(--sub);margin:6px 0 18px;animation:wipe .9s 1.7s var(--wz) both;position:relative}
#op .btn{animation:wipe .8s 3.3s var(--wz) both;position:relative;padding:10px 30px;font-size:14px;letter-spacing:.3em}
#op .art{height:min(46vh,380px);width:auto;opacity:0;transform:translateY(18px);animation:rise 1.2s .2s forwards;filter:drop-shadow(0 10px 18px rgba(143,119,194,.3));position:relative}
#op .lg{width:min(70%,300px);animation:wipe 1s .9s var(--wz) both;margin-top:6px;position:relative}
@keyframes rise{to{opacity:1;transform:none}}
/* cool opening */
#op.cool{background-color:#0d1022;background-image:linear-gradient(rgba(140,169,236,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(140,169,236,.10) 1px,transparent 1px);background-size:32px 32px;color:#e9ecff;overflow:hidden}
#op.cool .bg{position:absolute;inset:0;background-size:cover;background-position:60% 30%;opacity:0;animation:fd 1.6s .1s forwards;filter:saturate(.9)}
#op.cool .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,16,34,.35) 0%,rgba(13,16,34,.55) 45%,rgba(13,16,34,.96) 100%)}
#op.cool .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
#op.cool .art{display:none}
#op.cool .lg{filter:drop-shadow(0 0 14px rgba(143,119,194,.7));animation:wipe .9s .5s var(--wz) both;margin-top:40vh}
@keyframes glitch{0%,92%,100%{transform:none;clip-path:none}93%{transform:translateX(-4px);clip-path:inset(10% 0 55% 0)}95%{transform:translateX(5px);clip-path:inset(55% 0 10% 0)}97%{transform:translateX(-2px);clip-path:none}}
#op.cool .t1{color:#8ca9ec;margin-top:18px}
#op.cool .tl{animation:wipe .8s var(--wz) both;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
#op.cool .term{font-size:11.5px;line-height:1.9;color:#8ca9ec;text-align:left;margin:14px 0 4px;position:relative;min-height:5.6em;letter-spacing:.12em}
#op.cool .term b{color:#ff63bd;font-weight:400}
#op.cool .t3{color:#c9cffc}
#op.cool .btn{background:transparent;border:1px solid #8ca9ec;color:#e9ecff;box-shadow:0 0 16px rgba(140,169,236,.35),inset 0 0 12px rgba(143,119,194,.25)}
#op.cool .btn:active{background:rgba(140,169,236,.2)}
@keyframes fd{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.logo.swap{animation:lgs .55s ease}
@keyframes lgs{0%{opacity:1}20%{opacity:.35;filter:hue-rotate(40deg) blur(1px)}40%{opacity:1;clip-path:inset(0 0 45% 0)}60%{clip-path:inset(45% 0 0 0)}100%{clip-path:none;filter:none;opacity:1}}
.logo{display:block;margin:10px auto 0;width:min(78%,360px);aspect-ratio:900/340;height:auto;object-fit:contain;cursor:pointer;-webkit-user-select:none;user-select:none}
.hero{flex-direction:column;text-align:center;gap:10px}
.hero .stand{width:min(104%,440px);margin-left:-2%;height:auto;filter:drop-shadow(0 8px 14px rgba(143,119,194,.28));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.hero .row{display:flex;gap:12px;align-items:center;text-align:left}
.hero .row img{flex:0 0 64px;width:64px;height:auto}
.frame{cursor:zoom-in}
a.frame{cursor:pointer}
#lb{position:fixed;inset:0;z-index:90;background:rgba(238,241,250,.97);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;object-fit:contain;background:repeating-conic-gradient(rgba(140,169,236,.12) 0 25%,#fff 0 50%) 0 0/20px 20px;border:1px solid var(--blue)}
#lb .t{font-size:13px;color:var(--sub)}
#lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px}
#sec h2{margin-top:0}
.secretgrid{display:grid;gap:14px}

/* play */
.fx{position:fixed;pointer-events:none;z-index:300;font-size:16px;font-weight:700;line-height:1;animation:fxp .9s ease-out forwards}
@keyframes fxp{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.25) rotate(var(--r))}}
.hero{position:relative;padding-top:56px}
.hero .hint{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--violet);animation:hnt 2.4s ease-in-out infinite;pointer-events:none}
@keyframes hnt{50%{transform:translateY(4px);opacity:.55}}
.hero .stand,.hero .row img{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.bounce{animation:bounce .5s cubic-bezier(.3,1.6,.5,1)!important}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(.94,1.05) translateY(4px)}60%{transform:scale(1.05,.96) translateY(-10px)}100%{transform:scale(1)}}
.wig{animation:wig .5s ease!important}
@keyframes wig{20%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}80%{transform:rotate(-5deg)}}
.bub{position:absolute;left:50%;top:2px;transform:translateX(-50%) scale(.6);transform-origin:50% 100%;max-width:92%;background:#fff;border:1.5px solid var(--violet);border-radius:14px;padding:7px 14px;font-size:13px;line-height:1.5;color:var(--ink);opacity:0;pointer-events:none;z-index:5;box-shadow:3px 3px 0 var(--line);text-align:center}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:1.5px solid var(--violet);border-bottom:1.5px solid var(--violet);transform:translateX(-50%) rotate(45deg)}
.bub.on{animation:bub 2.6s forwards}
@keyframes bub{0%{opacity:0;transform:translateX(-50%) scale(.6)}10%{opacity:1;transform:translateX(-50%) scale(1.04)}16%{transform:translateX(-50%) scale(1)}86%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(.96)}}
.tile:hover b,.tile:active b{color:var(--violet)}
.tile:hover::after{transform:scale(2.4)}
.tile::after{transition:transform .35s}
.tile:active{transform:scale(.97)}
.capsule{display:block;margin:6px auto 2px;width:110px;height:110px;overflow:visible}
.capsule .hi,.capsule .lo{transform-box:fill-box;transform-origin:50% 50%}
.capsule.shake{animation:shk .9s ease-in-out}
@keyframes shk{0%,100%{transform:rotate(0)}10%{transform:rotate(-18deg)}25%{transform:rotate(16deg)}40%{transform:rotate(-14deg)}55%{transform:rotate(12deg)}70%{transform:rotate(-8deg)}85%{transform:rotate(5deg)}}
.capsule.open .hi{animation:hi .6s forwards}.capsule.open .lo{animation:lo .6s forwards}
@keyframes hi{to{transform:translate(-22px,-34px) rotate(-26deg);opacity:0}}
@keyframes lo{to{transform:translate(22px,26px) rotate(22deg);opacity:0}}
.rx.pop{animation:rxp .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes rxp{from{opacity:0;transform:scale(.7) translateY(14px)}to{opacity:1;transform:none}}
.slot.stamped{animation:stp .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes stp{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.ei{display:inline-flex;vertical-align:-3px;color:var(--violet);margin:0 2px}
/* tile menu */
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 6px}
.tile{position:relative;text-align:left;border:1px solid var(--blue);background:#fff;font:inherit;color:var(--ink);padding:12px 12px 10px 14px;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:78px;transition:.15s;overflow:hidden}
.tile::after{content:"";position:absolute;right:-14px;top:-14px;width:44px;height:44px;border-radius:50%;background:rgba(255,99,189,.10)}
.tile:hover,.tile:active{border-color:var(--pink);transform:translateY(-2px);box-shadow:3px 3px 0 var(--line)}
.tile .tic{position:absolute;right:12px;top:12px;color:var(--violet);opacity:.75;z-index:1;transition:.25s}
.tile:hover .tic{color:var(--pink);transform:rotate(-12deg) scale(1.12);opacity:1}
.tile .n{font-size:10px;color:var(--pink);letter-spacing:.14em}
.tile b{font-weight:500;font-size:16px;letter-spacing:.1em}
.tile .e{font-size:10px;color:var(--violet);letter-spacing:.18em}
.tile .d{font-size:11.5px;color:var(--sub);line-height:1.5;margin-top:2px}
.menu .tile.wide{grid-column:1/-1}
/* ===== PC layout ===== */
@media(min-width:900px){
  .wrap{max-width:1080px;padding:0 32px 48px}
  .logo{width:340px}
  .tabs{margin:10px 0 0;padding:8px 14px 0;justify-content:center;gap:6px}
  .tab{font-size:14px;padding:9px 20px 8px}
  .sheet{padding:34px 40px 44px;font-size:15px}
  h2{font-size:19px;margin:34px 0 14px}
  .grid{grid-template-columns:repeat(4,1fr);gap:18px}
  .frame .cap{font-size:13px}
  .panel.home{display:grid;grid-template-columns:minmax(300px,36%) 1fr;column-gap:44px;align-items:start}
  .panel.home>*{grid-column:2}
  .panel.home>.hero{grid-column:1;grid-row:1 / span 30;position:sticky;top:76px;margin:0;padding:56px 0 0;border:0;background:none}
  .hero .stand{width:min(100%,420px);max-height:76vh;object-fit:contain}
  .panel.home>h2:nth-of-type(1){margin-top:0}
  .lk{padding:14px 18px}
  .menu{grid-template-columns:repeat(2,1fr);gap:12px}
  .tile{min-height:92px}
  #lb img{max-height:86vh}
  #lbsec{max-width:980px!important}
  .secretgrid{grid-template-columns:repeat(2,1fr)}
  #op.cool{align-items:flex-start;text-align:left;padding-left:9vw;justify-content:center}
  #op.cool .bg{background-size:auto 100%;background-position:right center;background-repeat:no-repeat}
  #op.cool .bg::after{background:linear-gradient(90deg,#0d1022 0%,#0d1022 34%,rgba(13,16,34,.55) 62%,rgba(13,16,34,.1) 100%)}
  #op.cool .lg{margin-top:0;width:min(34vw,420px)}
  #op.cool .t1,#op.cool .term,#op.cool .t3,#op.cool .btn{margin-left:4px}
  #op.cool .btn{padding:12px 38px}
  #op .art{height:min(64vh,560px)}
}
@media(min-width:1200px){
  /* pop the standing art out of the sheet to the left */
  .panel.home>.hero{overflow:visible}
  .hero .stand{width:calc(100% + 150px);max-width:560px;max-height:82vh;margin-left:-120px}
  .hero .bub{left:calc(50% - 45px)}
  .hero .hint{left:-90px}
  .hero .row{padding-left:0}
  .menu{grid-template-columns:repeat(4,1fr)}
  .menu .tile.wide{grid-column:span 2}
}
@media(min-width:1500px){
  .wrap{max-width:1240px}
  .grid{grid-template-columns:repeat(5,1fr)}
}
footer{text-align:center;font-size:11px;color:var(--sub);margin-top:22px}

/* 立ち絵を紙面に馴染ませる: 軌道リング+地面の楕円+十字の目印 */
.hero .stage{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-end;isolation:isolate}
.hero .stage::before{content:"";position:absolute;z-index:-1;left:50%;top:46%;width:86%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed rgba(143,119,194,.45);background:radial-gradient(circle,rgba(140,169,236,.16),rgba(140,169,236,0) 68%)}
.hero .stage::after{content:"";position:absolute;z-index:-1;left:50%;bottom:3.5%;width:62%;height:9%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(143,119,194,.38),rgba(143,119,194,0) 70%);border:1px dashed rgba(143,119,194,.35)}
.hero .stage .stand{animation:none!important;filter:drop-shadow(0 2px 3px rgba(60,50,110,.22));-webkit-mask-image:linear-gradient(#000 96%,transparent);mask-image:linear-gradient(#000 96%,transparent)}
</style>
</head>
<body>

<div id="op" role="dialog" aria-label="オープニング">
  <div class="bg" id="opBg" hidden></div><div class="scan"></div><svg class="stars" id="ops" width="100%" height="100%"></svg>
  <img class="art" id="opArt" alt="" hidden><img class="lg" id="opLogo" alt="" hidden>
  <div class="t1 mono">RESEARCH LOG : START</div><div class="term mono" id="opTerm"></div>
  <div class="t2" id="opName"></div>
  <div class="t3" id="opTag"></div>
  <button class="btn" id="opGo">処方開始</button>
</div>

<div class="wrap">
  <header>
    <div class="stamp-top mono">RESEARCH NOTE · No.<span id="noDay"></span></div>
    <img class="logo" id="hLogo" alt="" hidden><h1 id="hName"></h1>
    <div class="read mono" id="hRead"></div>
    <p class="tag" id="hTag"></p>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main class="sheet" id="main"></main>
  <footer class="mono">© Shisui Re-ka · all works are protected<br><span style="opacity:.75">Icons: <a href="licenses/tabler-icons-LICENSE.txt" style="color:inherit">Tabler Icons</a> (MIT License)</span></footer>
</div>

<div id="lb" role="dialog" aria-label="拡大表示"><button class="btn line x" id="lbx">閉じる</button><img id="lbi" alt=""><div class="t" id="lbt"></div><div id="lbsec" style="display:none;width:100%;max-width:720px;overflow:auto;max-height:80vh"></div></div>
<script src="icons.js?v=5"></script>
<script src="core.js?v=9"></script>
<script src="data.js?v=9"></script>
<script>
loadContent().then(function(){
const S = window.SITE;
const $ = (s,r=document)=>r.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* header */
$('#hName').textContent = S.name;
$('#hRead').textContent = S.reading + ' / ' + S.en;
$('#hTag').textContent = S.tagline;
$('#noDay').textContent = today().replace(/-/g,'');
$('#opName').textContent = S.name;
if(S.opStyle==='cool'){const o=$('#op');o.classList.add('cool');if(S.opBg){const b=$('#opBg');b.style.backgroundImage='url('+S.opBg+')';b.hidden=false}
  const lines=['PATIENT : '+S.en.toUpperCase(),'STATUS  : <b>ONLINE</b>','RX      : '+S.tagline];const T=$('#opTerm');T.innerHTML=lines.map((l,i)=>`<div class="tl" style="animation-delay:${(1.9+i*.4).toFixed(1)}s">${l.replace(/ /g,'&nbsp;')}</div>`).join('');
  $('#opTag').style.display='none'}
else if(S.hero){const a=$('#opArt');a.src=S.hero;a.hidden=false}
if(S.logo){const a=$('#opLogo');a.src=S.logo;a.hidden=false}
$('#opTag').textContent = S.tagline;
if(S.logo){const lg=$('#hLogo');lg.src=S.logo;lg.alt=S.name;lg.hidden=false;$('#hName').style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)';}
/* lightbox */
const lb=$('#lb');
function openLb(src,t){$('#lbsec').style.display='none';$('#lbi').style.display='';$('#lbi').src=src;$('#lbt').textContent=t||'';lb.classList.add('on')}
$('#lbx').addEventListener('click',()=>lb.classList.remove('on'));
lb.addEventListener('click',e=>{if(e.target===lb)lb.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});
/* logo tap: color variants */
(function(){const V=S.logoVariants||[];if(V.length<2)return;V.forEach(s=>{const i=new Image();i.src=s});let k=0;const lg=$('#hLogo');
  lg.addEventListener('click',()=>{k=(k+1)%V.length;lg.classList.remove('swap');void lg.offsetWidth;lg.classList.add('swap');setTimeout(()=>{lg.src=V[k]},170);
    lg.addEventListener('animationend',()=>lg.classList.remove('swap'),{once:true});
    const r=lg.getBoundingClientRect();window.burst&&window.burst(r.left+r.width/2,r.top+r.height/2,8)})})();
/* secret: logo 5 taps */
(function(){let n=0,t=null;const lg=$('#hLogo');(lg.hidden?$('#hName'):lg).addEventListener('click',()=>{n++;clearTimeout(t);t=setTimeout(()=>n=0,1500);if(n>=5){n=0;const s=$('#lbsec');$('#lbi').style.display='none';$('#lbt').textContent='';s.style.display='block';s.innerHTML='<h2 style="margin-top:0">設定資料</h2><p class="muted">'+esc(S.secretLead)+'</p><div class="secretgrid">'+S.secret.map(x=>'<div class="frame" style="cursor:default"><img style="width:100%;display:block;background:#fff" src="'+esc(x.img)+'" alt="'+esc(x.title)+'"><div class="cap">'+esc(x.title)+'</div></div>').join('')+'</div>';lb.classList.add('on')}})})();
document.title = S.name + ' | 研究ノート';

/* opening */
(function(){
  const svg=$('#ops'); let h='';
  for(let i=0;i<26;i++){
    const x=Math.random()*100,y=Math.random()*100,r=(Math.random()*1.4+.6).toFixed(1),d=(Math.random()*3).toFixed(1);
    const col=['#8ca9ec','#8f77c2','#ff63bd'][i%3];
    h+=`<circle class="tw" cx="${x}%" cy="${y}%" r="${r}" fill="${col}" style="animation-delay:${d}s"/>`;
  }
  svg.innerHTML=h;
  const op=$('#op');
  const seen = (()=>{try{return sessionStorage.getItem('op')}catch(e){return null}})();
  if(seen){op.classList.add('gone');}
  $('#opGo').addEventListener('click',()=>{op.classList.add('gone');try{sessionStorage.setItem('op','1')}catch(e){}});
})();

/* icons */
window.ICONS.drip='<path d="M7 4h10v7a5 5 0 0 1-10 0z"/><path d="M7 8h10"/><path d="M10 1h4"/><path d="M12 1v3"/><path d="M12 16v2"/><path d="M12 19.5c-1 1.2-1.6 2-1.6 2.6a1.6 1.6 0 0 0 3.2 0c0-.6-.6-1.4-1.6-2.6z"/>';
const emo=t=>esc(t).replace(/💊/g,'<span class="ei">'+ico('pill',16)+'</span>').replace(/✝️?/g,'<span class="ei">'+ico('cross',16)+'</span>');
const IC = {
  link:ico('link'), pill:ico('pill'), cross:ico('cross'), vaccine:ico('vaccine'), drip:ico('drip'), bandage:ico('bandage'), kit:ico('first-aid-kit'), heart:ico('heartbeat'), cap:ico('capsule-horizontal')
};
const ROT=[IC.pill,IC.drip,IC.vaccine,IC.cross,IC.bandage,IC.drip,IC.kit,IC.cap];
const heroSvg = `<svg viewBox="0 0 96 96" fill="none" stroke="#8f77c2" stroke-width="1.5"><circle cx="48" cy="48" r="44" stroke="#8ca9ec" stroke-dasharray="3 4"/><path d="M48 18v60M32 36h32" stroke="#ff63bd" stroke-width="2"/><rect x="14" y="60" width="30" height="11" rx="5.5" transform="rotate(-30 29 65)"/><path d="M80 22l-3 3M70 32l8-8M72 34l-9 9 5 5 9-9z" /><circle cx="22" cy="24" r="1.6" fill="#8ca9ec" stroke="none"/><circle cx="78" cy="72" r="1.6" fill="#ff63bd" stroke="none"/><circle cx="70" cy="14" r="1.2" fill="#8f77c2" stroke="none"/></svg>`;

/* panels */
const tabs = [
  {id:'chart', ja:'カルテ', en:'CHART'},
  {id:'links', ja:'リンク', en:'LINKS'},
  {id:'x',     ja:'X', en:'POSTS'},
  {id:'arc',   ja:'アーカイブ', en:'ARCHIVE'},
  {id:'gal',   ja:'ギャラリー', en:'GALLERY'},
  {id:'req',   ja:'依頼', en:'COMMISSION'},
  {id:'shop',  ja:'ショップ', en:'SHOP'},
  {id:'fun',   ja:'処方箋', en:'FORTUNE'}
];
const P = {};

const MENU=[
  ['links','リンク','LINKS','SNS・支援・ほしい物','link'],
  ['x','ポスト','POSTS','Xの最新ポスト','brand-x'],
  ['arc','アーカイブ','ARCHIVE','配信・ハイライト','player-play'],
  ['gal','ギャラリー','GALLERY','立ち絵・ロゴ・制作実績','photo'],
  ['req','依頼','COMMISSION','受付状況・料金・テンプレ','pencil'],
  ['shop','ショップ','SHOP','BOOTH・FANBOX','shopping-bag'],
  ['fun','処方箋','FORTUNE','おみくじ・スタンプカード','drip']
];
function menuHtml(){return '<div class="menu">'+MENU.map((m,i)=>`<button class="tile${i===MENU.length-1?' wide':''}" data-go="${m[0]}"><span class="tic">${ico(m[4],26)}</span><span class="n mono">No.${String(i+2).padStart(2,'0')}</span><b>${m[1]}</b><span class="e mono">${m[2]}</span><span class="d">${m[3]}</span></button>`).join('')+'</div>'}
P.chart = () => {
  let h = `<div class="hero"><div class="hint mono">▼ タップしてみて</div>${S.hero?`<div class="stage"><img class="stand" src="${esc(S.hero)}" alt="${esc(S.name)}"></div>`:heroSvg}<div class="row">${S.heroChibi?`<img src="${esc(S.heroChibi)}" alt="">`:''}<div><p>${esc(S.sub)}</p>${S.about.map(t=>`<p class="muted">${esc(t)}</p>`).join('')}</div></div></div>
  <h2><span class="no mono">MENU</span>目次</h2>${menuHtml()}
  <h2><span class="no mono">01</span>プロフィール</h2>
  <table class="chart">${S.chart.map(r=>`<tr><th class="mono">${esc(r[0])}</th><td>${emo(r[1])}</td></tr>`).join('')}</table>`;
  h += `<h2><span class="no mono">02</span>ご案内</h2>` + S.notes.map(n=>`<details><summary>${esc(n.title)}</summary><div class="in">${n.body.map(b=>`<p>${esc(b)}</p>`).join('')}</div></details>`).join('');
  h += `<h2><span class="no mono">03</span>配信のお約束</h2><details open><summary>みんなで気持ちよく過ごすために</summary><div class="in"><ol class="rules">${S.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div></details>`;
  h += `<h2><span class="no mono">04</span>お願いごと</h2>` + S.wish.map(n=>`<details><summary>${esc(n.title)}</summary><div class="in"><p>${esc(n.body)}</p></div></details>`).join('');
  h += `<h2><span class="no mono">05</span>クレジット</h2><table class="chart">${S.credits.map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table><p class="muted" style="margin-top:8px">${esc(S.creditsNote)}</p>`;
  return h;
};

P.links = () => {
  const groups = {}; S.links.forEach(l=>{(groups[l.group]=groups[l.group]||[]).push(l)});
  const nm = {SNS:'SNS', SHOP:'支援・ショップ', WORK:'お仕事', OTHER:'その他'};
  let h = `<h2><span class="no mono">LINK</span>リンク集</h2><p class="muted">従来のリットリンクの項目をすべて掲載しています。</p>`;
  for(const g in groups){
    h += `<div class="group mono">▼ ${esc(nm[g]||g)}</div>`;
    groups[g].forEach((l,i)=>{
      const ic = ROT[i%ROT.length];
      if(l.url) h += `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">${ic}<div><b>${esc(l.label)}</b><span class="s">${esc(l.sub||'')}</span></div><span class="go">›</span></a>`;
      else h += `<div class="lk off">${ic}<div><b>${esc(l.label)}</b><span class="s">${esc(l.sub||'')}</span></div><span class="badge mono">準備中</span></div>`;
    });
  }
  return h;
};

P.x = () => {
  let h = `<h2><span class="no mono">POST</span>最新の処方(ポスト)</h2>`;
  if(S.xposts.length){
    h += S.xposts.map(u=>{ const m=String(u).replace('x.com','twitter.com'); return `<blockquote class="twitter-tweet" data-dnt="true"><a href="${esc(m)}">${esc(u)}</a></blockquote>`}).join('');
    setTimeout(()=>{ if(!window.twttr){const s=document.createElement('script');s.src='https://platform.twitter.com/widgets.js';s.async=true;document.body.appendChild(s)} else {window.twttr.widgets&&window.twttr.widgets.load($('#main'))} },50);
  } else {
    h += `<div class="empty">ポストの掲載はこれから準備します。<br>URLを貼るだけで載せられる形にします。</div>`;
  }
  h += `<p style="margin-top:14px"><a class="btn line" href="${esc(S.xProfile)}" target="_blank" rel="noopener">Xで見る ›</a></p>`;
  return h;
};

P.arc = () => {
  let h = `<h2><span class="no mono">LOG</span>配信アーカイブ・ハイライト</h2>`;
  if(!S.archive.length) return h + `<div class="empty">アーカイブは準備中です。<br>YouTubeの動画URLを追加するとここに並びます。</div>`;
  h += S.archive.map(a=>`<a class="lk" href="${esc(a.url)}" target="_blank" rel="noopener">${IC.pill}<div><b>${esc(a.title)}</b><span class="s">${esc(a.kind||'')} ${esc(a.date||'')}</span></div><span class="go">›</span></a>`).join('');
  return h;
};

P.gal = () => {
  let h = `<h2><span class="no mono">ART</span>イラストギャラリー</h2><div class="chips" id="chips">${S.galleryCats.map((c,i)=>`<button class="chip" aria-pressed="${i===0}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="grid" id="gal"></div>${(S.tagLinks||[]).map(t=>`<p style="margin-top:14px"><a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.label)} ›</a></p>`).join('')}<p class="muted" style="margin-top:14px">無断転載・AI学習利用は禁止です。</p>`;
  return h;
};
function drawGal(cat){
  const g=$('#gal'); if(!g) return;
  const items = S.gallery.filter(x=>cat==='すべて'||x.cat===cat);
  g.innerHTML = items.map(x=>`<div class="frame" data-src="${esc(x.img)}" data-t="${esc(x.title)}"><div class="ph">${x.img?`<img loading="lazy" src="${esc(x.img)}" alt="${esc(x.title)}">`:IC.cross.replace('width="22" height="22"','width="34" height="34"')}</div><div class="cap">${esc(x.title)}<i>${esc(x.cat)}${x.by?' / '+esc(x.by):''}</i></div></div>`).join('') || `<div class="empty" style="grid-column:1/-1">この分類の作品はまだありません。</div>`;
  g.onclick=e=>{const f=e.target.closest('.frame');if(f&&f.dataset.src)openLb(f.dataset.src,f.dataset.t)};
}

P.req = () => {
  const c=S.commission, lab={open:'受付中',closed:'停止中',ask:'要相談'}[c.status]||c.status;
  let h = `<h2><span class="no mono">01</span>依頼の受付状況</h2><p><span class="status ${esc(c.status)}"><i></i>${lab}</span></p><p>${esc(c.note)}</p>`;
  h += `<h2><span class="no mono">02</span>料金表</h2>${c.prices.length?`<table class="price">${c.prices.map(p=>`<tr><td>${esc(p.item)}</td><td>${p.price?esc(p.price):'<span class="muted">準備中</span>'}</td></tr>`).join('')}</table>`:''}<p class="muted">${esc(c.pricesNote)}</p>${c.pricesUrl?`<p><a class="btn" href="${esc(c.pricesUrl)}" target="_blank" rel="noopener">料金表・規約を見る ›</a></p>`:''}`;
  const f=c.fanartGuide;
  h += `<h2><span class="no mono">03</span>${esc(f.title)}</h2><p>${esc(f.lead)}</p><ol class="rules">${f.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>`;
  h += `<details><summary>skeb用テンプレ</summary><div class="in"><pre class="tpl" id="tpl">${esc(c.template)}</pre><button class="btn line" id="cpy">コピーする</button></div></details>`;
  return h;
};

P.shop = () => {
  let h = `<h2><span class="no mono">SHOP</span>ショップ・グッズ</h2><div class="grid">${S.goods.map(g=>`<a class="frame" style="text-decoration:none;color:inherit" href="${esc(g.url)}" target="_blank" rel="noopener"><div class="ph">${g.img?`<img loading="lazy" src="${esc(g.img)}" alt="" style="object-fit:contain;background:#fff">`:IC.pill.replace('width="22" height="22"','width="34" height="34"')}</div><div class="cap">${esc(g.title)}<i>${esc(g.note||'')}</i></div></a>`).join('')}</div>`;
  h += S.links.filter(l=>l.group==='SHOP').map(l=>l.url?`<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">${IC.link}<div><b>${esc(l.label)}</b><span class="s">${esc(l.sub||'')}</span></div><span class="go">›</span></a>`:`<div class="lk off">${IC.link}<div><b>${esc(l.label)}</b></div><span class="badge mono">準備中</span></div>`).join('');
  return h;
};

P.fun = () => {
  const goal=S.stampGoal;
  return `<h2><span class="no mono">01</span>今日の処方箋(おみくじ)</h2><p class="muted">1日1回、ひいてみてください。</p><div id="rx"></div><button class="btn" id="draw">処方をもらう</button>
  <h2><span class="no mono">02</span>通院カード(スタンプ)</h2><p class="muted">1日1回、押せます。${goal}個たまったら満たんです。</p><div class="card" id="card"></div><button class="btn line" id="stamp">今日のスタンプ</button> <span class="muted" id="stmsg"></span>`;
};
let stampNew=false;
function bindFun(){
  const rx=$('#rx'), draw=$('#draw');
  const showRx=f=>{ rx.innerHTML = f?`<div class="rx"><div class="sub mono">${esc(f.sub)}</div><div class="rank">${esc(f.rank)}</div><div class="msg">${esc(f.msg)}</div></div>`:''; };
  const saved=store.get('rx',null);
  if(saved&&saved.d===today()){ showRx(S.fortunes[saved.i]); draw.textContent='今日はもらいました'; draw.disabled=true; draw.style.opacity=.5; }
  draw.addEventListener('click',()=>{
    const i=Math.floor(Math.random()*S.fortunes.length); store.set('rx',{d:today(),i}); draw.disabled=true; draw.style.opacity=.5; draw.textContent='調合中…';
    rx.innerHTML=`<svg class="capsule" viewBox="0 0 110 110"><g transform="rotate(-35 55 55)"><path class="hi" d="M55 36h-14a19 19 0 0 0 0 38h14z" fill="#ff63bd"/><path class="lo" d="M55 36h14a19 19 0 0 1 0 38h-14z" fill="#8ca9ec"/><path d="M55 36v38" stroke="#fff" stroke-width="2"/></g></svg>`;
    const cp=rx.firstChild; cp.classList.add('shake');
    setTimeout(()=>cp.classList.add('open'),950);
    setTimeout(()=>{ showRx(S.fortunes[i]); const c=rx.firstChild; if(c){c.classList.add('pop');const r=c.getBoundingClientRect();window.burst&&window.burst(r.left+r.width/2,r.top+30,14)} draw.textContent='今日はもらいました'; },1500);
  });
  const goal=S.stampGoal, card=$('#card'), st=$('#stamp'), msg=$('#stmsg');
  const render=()=>{
    const s=store.get('stamps',{n:0,d:''});
    card.style.gridTemplateColumns=`repeat(${goal>5?5:goal},1fr)`;
    card.innerHTML=Array.from({length:goal},(_,i)=>`<div class="slot ${i<s.n?'on':''}${stampNew&&i===s.n-1?' stamped':''}">${i<s.n?'✝':i+1}</div>`).join(''); stampNew=false;
    if(s.d===today()){st.disabled=true;st.style.opacity=.5;msg.textContent='今日は押しました';}
    if(s.n>=goal){msg.textContent='満たんです。おつかれさま。';}
  };
  st.addEventListener('click',()=>{
    let s=store.get('stamps',{n:0,d:''}); if(s.d===today())return;
    s.n = s.n>=goal?1:s.n+1; s.d=today(); store.set('stamps',s); stampNew=true; render();
    { const sl=card.querySelectorAll('.slot')[s.n-1]; if(sl&&window.burst){const r=sl.getBoundingClientRect();window.burst(r.left+r.width/2,r.top+r.height/2,12)} }
  });
  render();
}

/* play: tap sparkles anywhere */
(function(){
  const cols=['#8ca9ec','#8f77c2','#ff63bd'], sym=['✝','✚','✦','♡','＋'];
  function burst(x,y,n){
    for(let i=0;i<n;i++){
      const s=document.createElement('span'); s.className='fx';
      s.textContent=sym[Math.floor(Math.random()*sym.length)];
      const a=Math.random()*Math.PI*2, r=26+Math.random()*34;
      s.style.cssText=`left:${x}px;top:${y}px;color:${cols[i%3]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;--r:${(Math.random()*120-60)|0}deg`;
      document.body.appendChild(s); setTimeout(()=>s.remove(),950);
    }
  }
  window.burst=burst;
  document.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0)return; burst(e.clientX,e.clientY,5); },{passive:true});
})();
/* play: tap the character */
function talkBubble(el,text){
  let b=el.parentElement.querySelector('.bub'); if(!b){b=document.createElement('div');b.className='bub';el.parentElement.appendChild(b)}
  b.classList.remove('on'); void b.offsetWidth; b.textContent=text; b.classList.add('on');
}
let tapN=0,lastTalk=-1;
function bindHero(){
  const st=main.querySelector('.hero .stand'), ch=main.querySelector('.hero .row img');
  const say=(el,cls)=>{
    tapN++; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); el.addEventListener('animationend',()=>el.classList.remove(cls),{once:true});
    const r=el.getBoundingClientRect(); if(window.burst) window.burst(r.left+r.width/2,r.top+r.height*0.3,8);
    let t;
    if(tapN%10===0) t=S.talkOver; else { let i; do{i=Math.floor(Math.random()*S.talk.length)}while(i===lastTalk&&S.talk.length>1); lastTalk=i; t=S.talk[i]; }
    talkBubble(el.classList.contains('stand')?el:el.closest('.hero').querySelector('.stand'),t);
  };
  if(st) st.addEventListener('click',()=>say(st,'bounce'));
  if(ch) ch.addEventListener('click',()=>say(ch,'wig'));
}
/* mount */
const tabsEl=$('#tabs'), main=$('#main');
tabsEl.innerHTML = tabs.map(t=>`<button class="tab" role="tab" data-id="${t.id}" aria-selected="false">${t.ja}<small class="mono">${t.en}</small></button>`).join('');
/* tab bar: no jumpy scrolling */
function centerTab(b,instant){
  const c=tabsEl, l=b.offsetLeft, r=l+b.offsetWidth, v0=c.scrollLeft, v1=v0+c.clientWidth, m=24;
  let to=v0;
  if(l-m<v0) to=Math.max(0,l-m); else if(r+m>v1) to=r+m-c.clientWidth;
  if(Math.abs(to-v0)>1) c.scrollTo({left:to,behavior:instant?'auto':'smooth'});
}
function fitMin(){main.style.minHeight=Math.max(300,window.innerHeight-tabsEl.offsetHeight)+'px'}
window.addEventListener('resize',fitMin);
function keepTabsInPlace(){
  fitMin();
  /* if the page was scrolled past the tabs, pull it up so the sticky tab bar stays exactly where it is */
  const nat=main.getBoundingClientRect().top+window.scrollY-tabsEl.offsetHeight;
  if(window.scrollY>nat) window.scrollTo(0,Math.round(nat));
}
function show(id,byTab){
  if(!P[id]) id='chart';
  main.innerHTML = `<section class="panel on ${id==='chart'?'home':''}">${P[id]()}</section>`;
  tabsEl.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.id===id;b.setAttribute('aria-selected',on);if(on&&!byTab)centerTab(b,true)});
  if(id==='gal'){ drawGal('すべて'); $('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;$('#chips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));drawGal(b.dataset.c)}); }
  if(id==='fun') bindFun();
  if(id==='chart') bindHero();
  if(id==='chart') main.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>show(t.dataset.go)));
  if(id==='req'){ const c=$('#cpy'); c&&c.addEventListener('click',()=>{ const t=S.commission.template; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{c.textContent='コピーしました'}).catch(()=>{const r=document.createRange();r.selectNodeContents($('#tpl'));const s=getSelection();s.removeAllRanges();s.addRange(r);c.textContent='選択しました。コピーしてください'}) }); }
  try{history.replaceState(null,'','#'+id)}catch(e){}
  keepTabsInPlace();
}
let dn=null;
tabsEl.addEventListener('pointerdown',e=>{dn={x:e.clientX,l:tabsEl.scrollLeft}},{passive:true});
tabsEl.addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  if(dn&&(Math.abs(e.clientX-dn.x)>8||Math.abs(tabsEl.scrollLeft-dn.l)>4)){dn=null;return}
  dn=null; show(b.dataset.id,true);
});
show((location.hash||'').slice(1)||'chart');
});
</script>
</body>
</html>
